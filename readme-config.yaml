# Configuration for the README Generator

project:
  title: "My Awesome Monorepo"
  description: "A brief description of this awesome monorepo project."
  logo_url: "https://picsum.photos/80" # Replace with your logo URL (80x80 recommended)
  banner_url: "https://picsum.photos/1200/300" # Replace with your banner URL
  repobeats_url: "" # Optional: URL for repobeats.axiom.co analytics image

about:
  description: |
    This section provides more details about the project.
    Explain the purpose, goals, and key features.
    You can use multiple lines.

tech_stack:
  # Add shields.io badge markdown here (e.g., "[![Technology Name](URL)]")
  # Arrange them as you like, the generator will attempt a 4x4 grid.
  - "[![Python](https://img.shields.io/badge/Python-3776AB?logo=python&logoColor=white)]()"
  - "[![Textual](https://img.shields.io/badge/Textual-007ACC?logo=python&logoColor=white)]()" # Example, find appropriate shield
  - "[![PDM](https://img.shields.io/badge/PDM-E95420?logo=python&logoColor=white)]()" # Example
  - "[![YAML](https://img.shields.io/badge/YAML-545454?logo=yaml&logoColor=white)]()"
  # - "[![Next.js](https://img.shields.io/badge/Next.js-000000?logo=nextdotjs&logoColor=white)]()"
  # - "[![React](https://img.shields.io/badge/React-61DAFB?logo=react&logoColor=black)]()"
  # - "[![TypeScript](https://img.shields.io/badge/TypeScript-3178C6?logo=typescript&logoColor=white)]()"
  # - "[![Docker](https://img.shields.io/badge/Docker-2496ED?logo=docker&logoColor=white)]()"

# Optional: Customize structure detection if needed
structure_detection:
  app_dirs: ["apps", "examples", "services"] # Directories likely containing apps
  package_dirs: ["packages", "libs", "modules"] # Directories likely containing packages
  # ignore_patterns: [".*", "__pycache__", "node_modules", "build", "dist"] # Defaults are usually fine

quickstart:
  description: "Instructions to get your project set up locally."
  prerequisites:
    - "Python >= 3.12"
    - "PDM (Python Dependency Manager)"
    # - "Node.js & npm/yarn (if applicable)"
  installation:
    - "Clone the repo: `git clone https://github.com/your_username/your_repo.git`"
    - "Navigate into the project directory: `cd your_repo`"
    - "Install dependencies: `pdm install`"
    # - "Add any specific setup steps here, like setting up environment variables."
    # - |
    #   Configure environment variables:
    #   ```bash
    #   cp .env.example .env
    #   # Edit .env with your settings
    #   ```

usage:
  description: "How to run or use the project."
  examples:
    - "Run the main application: `pdm run start` (adjust based on your setup)"
    # - "Run tests: `pdm run test`"
    # - |
    #   Example code snippet:
    #   ```python
    #   print('Hello, World!')
    #   ```

roadmap:
  - "Implement core README generation"
  - "Add basic TUI structure"
  - "Integrate structure detection with TUI"
  - "Add README preview in TUI"
  # - "Integrate Gemma3/Ollama for description generation"

contributing:
  steps:
    - "Fork the Project"
    - "Create your Feature Branch (`git checkout -b feature/AmazingFeature`)"
    - "Commit your Changes (`git commit -m 'Add some AmazingFeature'`)"
    - "Push to the Branch (`git push origin feature/AmazingFeature`)"
    - "Open a Pull Request"

license:
  text: "Distributed under the MIT License. See `LICENSE` file for more information." # Or specify SPDX identifier like "MIT"

contact:
  name: "Your Name / Organization"
  email: "your.email@example.com"
  project_link: "https://github.com/your_username/your_repo" # Link to the repository

acknowledgements:
  - "https://github.com/Textualize/textual"
  - "https://github.com/yaml/pyyaml"
  # - "Link to helpful resources or inspirations"