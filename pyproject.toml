[project]
name = "readme-gen"
version = "0.1.0"
description = "readme generator TUI"
authors = [
    {name = "Antonio Reid", email = "read.musik@gmail.com"},
]
dependencies = ["textual[syntax]>=3.0.0", "pyyaml>=6.0.2", "textual-dev>=1.7.0", "pynput>=1.8.1"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
[project.scripts]
readme-gen = "readme_gen.main:run"


[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
